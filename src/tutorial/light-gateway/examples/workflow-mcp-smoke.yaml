document:
  dsl: "1.0.3"
  namespace: light-demo
  name: workflow-mcp-smoke
  version: "1.0.0"
  title: Workflow MCP Smoke Test
  summary: Deterministic read-only workflow used to qualify the gateway-to-workflow MCP path.
  tags:
    testType: local
    dependencies: none
evaluate:
  language: cel
input:
  schema:
    format: json
    document:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 256
output:
  schema:
    format: json
    document:
      type: object
      additionalProperties: false
      required:
        - message
        - executedBy
      properties:
        message:
          type: string
        executedBy:
          type: string
do:
  - finish:
      set:
        message: "${{ message }}"
        executedBy: light-workflow
